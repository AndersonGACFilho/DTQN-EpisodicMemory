name: Task
description: A task from the final project schedule
title: "[P?] "
labels: ["task"]
type: Task
projects: ["AndersonGACFilho/19"]
body:
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - P1 (environments and evaluation)
        - P2 (kNN memory module)
        - P3 (baselines, compute budget and DRQN)
        - P4 (coordination, noise and paper)
        - Everyone
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due
      placeholder: "Wed 11/18"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Environment
        - Memory
        - Baseline
        - Experiment
        - Writing
        - Coordination
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Objective completion criterion.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: 'Issues or deliverables this task depends on, for example "depends on #4".'
      placeholder: None
