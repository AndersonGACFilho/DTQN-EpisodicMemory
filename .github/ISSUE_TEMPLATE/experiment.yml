name: Experiment
description: An experiment run, ablation or pilot
title: "[Exp] "
labels: ["experiment"]
type: Experiment
projects: ["AndersonGACFilho/19"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: Which hypothesis or question this run answers.
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - DTQN (original)
        - DTQN + kNN memory
        - DTQN (K covering the corridor)
        - DRQN (original)
        - DRQN + kNN memory
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Passive T-Maze
        - Noisy T-Maze
        - Car Flag
        - Memory Cards
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Dependency distance, context length K and memory settings.
      value: |
        - Corridor length / dependency distance:
        - Context length K:
        - Memory size:
        - Top-k:
        - Gate: on / off
        - Key layer:
        - Keys: stop-gradient / differentiable
        - Noise level (Noisy T-Maze):
    validations:
      required: true
  - type: input
    id: seeds
    attributes:
      label: Seeds
      value: "5"
  - type: textarea
    id: command
    attributes:
      label: Command to reproduce
      render: shell
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] **AC1:** Every configuration has results for all seeds
        - [ ] **AC2:** The success / tie criterion from #1 is evaluated
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      value: |
        - [ ] Configs and the exact command recorded in this issue
        - [ ] Raw results (CSV per seed) committed under `results/` or linked
        - [ ] Summary posted: mean ± std and 95% CI over at least 5 seeds
        - [ ] Wall-clock time and peak GPU memory reported
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Success rate (mean ± std, 95% CI), cue-in-top-k hit rate, wall-clock time and peak GPU memory. Can be filled in later.
